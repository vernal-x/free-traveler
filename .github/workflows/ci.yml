name: CI

# 실제 개발 루트는 app/ 이지만(DEC-001), GitHub Actions는 저장소 진짜 루트의
# .github/workflows/ 만 인식하므로 이 파일은 여기(저장소 루트)에 있어야 하고,
# 모든 Step은 `defaults.run.working-directory: app`으로 실제 npm 프로젝트
# 디렉터리에서 실행된다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:unit

      - run: npm run task:contract

      - run: npm run screen:contract -- --mode=ci

      - run: npm run build

  public-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Supabase Secret 없이 실행 가능한 공개(비로그인) Smoke만 돌린다.
      # 로그인이 필요한 흐름(tests/e2e/auth-smoke.spec.ts)은 여기서 실행하지
      # 않으며, GitHub Actions의 필수 Gate가 아니다.
      - run: npm run test:e2e:public

      - name: Upload Playwright report (실패 시에만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
